[package]
name = "desktop-ring"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["ui"]
ui = ["dep:gtk", "dep:gtk4-layer-shell", "dep:pangocairo"]

[dependencies]
anyhow = "1.0"
futures-util = "0.3"
libpulse-binding = { version = "2.30.1", default-features = false, features = ["pa_v15"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal"] }
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }
gtk = { package = "gtk4", version = "=0.9.7", features = ["v4_12"], optional = true }
gtk4-layer-shell = { version = "=0.5.0", optional = true }

pangocairo = { version = "0.20", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[patch.crates-io]
# Keep cancellation ownership identical in Nix and portable builds.
libpulse-binding = { path = "vendor/libpulse-binding" }

[profile.release]
opt-level = 2
strip = true

[profile.dev]
debug = 0
