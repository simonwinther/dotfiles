[package]
name = "background-grid"
version = "1.0.0"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "=0.9.7", features = ["v4_8"] }
libc = "=0.2.186"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
similar = "=2.7.0"
tempfile = "=3.27.0"

[[bin]]
name = "background-grid-native"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
