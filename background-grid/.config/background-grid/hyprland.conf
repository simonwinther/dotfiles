# Wallpaper grid: override the earlier Omarchy/Waypaper shortcut.
unbind = SUPER CTRL, SPACE
bindd = SUPER CTRL, SPACE, Wallpaper grid, exec, ~/.local/bin/background-grid

windowrule {
  name = background-grid
  match:class = ^(com\.simon\.BackgroundGrid)$
  float = on
  center = on
  opacity = 1.0 override 1.0 override
  no_blur = on
  no_shadow = on
  border_color = rgba(464e68ff)
}

# Omarchy's anonymous opacity rules run after named rules.
windowrule = tag -default-opacity, match:class ^(com\.simon\.BackgroundGrid)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(com\.simon\.BackgroundGrid)$
