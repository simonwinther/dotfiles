[package]
name = "desktop-bar"
description = "Morphing Notch Bar: native Wayland menus and desktop controls"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "desktop-bar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-channel = "2"
async-io = "2"
futures-lite = "2"
clipboard-history = { path = "../../../../clipboard-picker/.local/share/clipboard-picker/core" }
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
calloop = { version = "0.14", features = ["signals"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
tiny-skia = "0.12"
resvg = { version = "0.49", default-features = false }
ab_glyph = "0.2"
memmap2 = "0.9"
nucleo-matcher = "=0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
libc = "0.2"
libpulse-binding = { path = "../../../../desktop-ring/.local/share/desktop-ring/vendor/libpulse-binding", default-features = false, features = ["pa_v15"] }
desktop-weather = { path = "weather" }
zbus = { version = "5.13.2", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 0

[workspace]
members = ["weather"]
default-members = [".", "weather"]
