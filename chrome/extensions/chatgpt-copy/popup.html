<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
  }

  body {
    width: 232px;
    margin: 0;
    font: 13px/1.45 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #ffffff;
    color: #18181b;
  }

  main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
  }

  .title {
    font-weight: 600;
  }

  .hint {
    margin-top: 2px;
    font-size: 12px;
    color: #71717a;
  }

  .switch {
    position: relative;
    display: inline-block;
    flex: none;
    width: 36px;
    height: 20px;
  }

  .switch input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    inset: 0;
    cursor: pointer;
    border-radius: 999px;
    background: #d4d4d8;
    transition: background 120ms ease;
  }

  .slider::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    transition: transform 120ms ease;
  }

  input:checked + .slider {
    background: #16a34a;
  }

  input:checked + .slider::before {
    transform: translateX(16px);
  }

  input:focus-visible + .slider {
    outline: 2px solid #2563eb;
    outline-offset: 2px;
  }

  @media (prefers-color-scheme: dark) {
    body {
      background: #202124;
      color: #e8eaed;
    }

    .hint {
      color: #9aa0a6;
    }

    .slider {
      background: #5f6368;
    }
  }
</style>
</head>
<body>
<main>
  <div>
    <div class="title">LaTeX copy</div>
    <div class="hint" id="status">Enabled</div>
  </div>
  <label class="switch" aria-label="Enable LaTeX copy">
    <input type="checkbox" id="toggle" checked>
    <span class="slider"></span>
  </label>
</main>
<script src="popup.js"></script>
</body>
</html>
