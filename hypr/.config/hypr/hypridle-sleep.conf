general {
    lock_cmd = desktopctl lock
    before_sleep_cmd = desktopctl lock --only
    after_sleep_cmd = desktopctl wake
    # Release logind's delay inhibitor only after Wayland confirms the lock.
    inhibit_sleep = 3
}

# Availability follows the captured screensaver-off preference. This listener
# remains independent of the opt-in lock timeout and logind sleep protection.
listener {
    timeout = 150
    on-timeout = desktopctl screensaver idle
}
