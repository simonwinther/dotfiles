[package]
name = "text-picker"
version = "1.0.0"
edition = "2024"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
wl-clipboard-rs = "=0.9.3"

[[bin]]
name = "text-picker-native"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
