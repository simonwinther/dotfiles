[package]
name = "desktop-search"
version = "0.1.0"
edition = "2024"

[dependencies]
nucleo-matcher = "=0.3.1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-english = "0.2"
csv = "1"
emojis = "0.9"
fend-core = "1.5"
libc = "0.2"
percent-encoding = "2"
prost = "0.14"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
unicode_names2 = "4"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 0
