[package]
name = "cluster-tools"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "=1.0.103"
clap = { version = "=4.6.1", features = ["derive", "env"] }
regex = "=1.12.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
crossterm = { version = "=0.29.0", features = ["osc52"] }
ratatui = { version = "=0.30.2", features = ["unstable-rendered-line-info"] }

[[bin]]
name = "cluster-native"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
