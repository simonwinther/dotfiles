[package]
name = "cluster-tools"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive", "env"] }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
crossterm = { version = "=0.29.0", features = ["osc52"] }
# The default calendar widget, macros and underline colors are unused; skip
# them. underline-color alone would lock the unused termwiz and termina backends.
ratatui = { version = "=0.30.2", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "unstable-rendered-line-info",
] }

[[bin]]
name = "cluster-native"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
