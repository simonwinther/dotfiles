[package]
name = "project-picker-tui"
version = "0.1.0"
edition = "2024"

[lib]
name = "project_picker"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
crossterm = "=0.29.0"
libc = "=0.2.191"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
unicode-general-category = "=1.1.0"
unicode-width = "=0.2.2"

[profile.release]
lto = "thin"
strip = true
