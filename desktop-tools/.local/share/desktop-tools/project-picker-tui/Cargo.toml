[package]
name = "project-picker-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
crossterm = "=0.29.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde_json = "=1.0.151"
unicode-width = "=0.2.2"

[profile.release]
lto = "thin"
strip = true
