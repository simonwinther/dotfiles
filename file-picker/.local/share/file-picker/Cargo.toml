[package]
name = "file-picker"
version = "1.0.0"
edition = "2024"

[features]
drag = ["dep:gtk"]

[dependencies]
libc = "=0.2.186"
serde_json = "=1.0.151"
gtk = { package = "gtk4", version = "=0.9.7", features = ["v4_8"], optional = true }

[[bin]]
name = "file-picker-native"
path = "src/main.rs"

[[bin]]
name = "file-picker-drag"
path = "src/drag.rs"
required-features = ["drag"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
