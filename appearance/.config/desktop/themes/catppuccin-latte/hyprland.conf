# Latte gradient with a deeper pink, mauve, and blue for clearer focus.
# Inactive borders use a soft Latte gray; geometry stays unchanged.
$activeBorderColor = rgb(c94daf) rgb(8839ef) rgb(1e66f5) 45deg
$inactiveBorderColor = rgba(9ca0b080)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    shadow {
        # Keep inactive outlines subtle without changing the active shadow.
        color_inactive = rgba(1a1a1a33)
    }
}
