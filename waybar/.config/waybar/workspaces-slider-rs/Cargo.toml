[package]
name = "workspaces-slider"
version = "0.1.0"
edition = "2021"

[dependencies]
# No keyboard input, so xkbcommon (and its pkg-config build dep) is dead weight.
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
tiny-skia = "0.12.0"
serde_json = "1.0.151"
fontdue = "0.9.4"
libc = "0.2.189"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
