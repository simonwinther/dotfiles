[package]
name = "waybar-weather"
version = "1.0.0"
edition = "2024"

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[[bin]]
name = "waybar-weather-native"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
