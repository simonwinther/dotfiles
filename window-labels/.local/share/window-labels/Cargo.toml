[package]
name = "window-labels"
description = "Click-through name labels on the top border of visible Hyprland windows"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "window-labels"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
wayland-protocols = { version = "0.32", features = ["client"] }

[profile.release]
opt-level = 3
lto = true
