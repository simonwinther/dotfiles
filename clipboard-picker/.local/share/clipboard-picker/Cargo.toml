[package]
name = "clipboard-picker"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "=1.0.104"
gtk = { package = "gtk4", version = "=0.9.7", features = ["v4_8"] }
gtk4-layer-shell = "=0.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[[bin]]
name = "clipboard-picker-native"
path = "src/main.rs"

[profile.release]
opt-level = 2
strip = true
