[package]
name = "formula-plot"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "=1.0.103"
clap = { version = "=4.6.1", features = ["derive"] }
gtk = { package = "gtk4", version = "=0.9.7", features = ["v4_8"] }
png = "=0.18.1"
tempfile = "=3.27.0"

[[bin]]
name = "plot-native"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
