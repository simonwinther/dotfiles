[package]
name = "iphone-transfer"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.103"
libc = "=0.2.186"
mime_guess = "=2.0.5"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[[bin]]
name = "iphone-transfer-native"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
